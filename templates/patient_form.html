{% extends 'layout.html' %}

{% block content %}

<h2>Patient Registration</h2>

<hr>

{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}

<div class="alert alert-{{category}}">
{{message}}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="row">

<div class="col-md-6">

<label>Patient Name</label>

<input
type="text"
name="patient_name"
class="form-control"
required>

</div>

<div class="col-md-3">

<label>Age</label>

<input
type="number"
name="age"
class="form-control"
required>

</div>

<div class="col-md-3">

<label>Gender</label>

<select
name="gender"
class="form-control">

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control">

</div>

<div class="col-md-4">

<label>Admission Date</label>

<input
type="date"
name="admission_date"
class="form-control"
required>

</div>

<div class="col-md-4">

<label>Blood Group</label>

<input
type="text"
name="blood_group"
class="form-control">

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label>Height (cm)</label>

<input
type="number"
step="0.01"
name="height"
class="form-control">

</div>

<div class="col-md-4">

<label>Weight (kg)</label>

<input
type="number"
step="0.01"
name="weight"
class="form-control">

</div>

<div class="col-md-4">

<label>Emergency Contact</label>

<input
type="text"
name="emergency_contact"
class="form-control">

</div>

</div>

<br>

<label>Address</label>

<textarea
name="address"
class="form-control"></textarea>

<br>

<button
class="btn btn-success">

Register Patient

</button>

</form>

{% endblock %}
